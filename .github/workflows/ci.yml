name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      YUNXI_USE_FAKE_EMBEDDING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Core Business Tests
        shell: pwsh
        run: |
          python -m pytest backend/tests/ -k "not harness" -v

      - name: Run Code Syntax and Doc Check
        shell: pwsh
        run: |
          python -m ruff check backend/
          python backend/scripts/check_doc_garden.py --summary
